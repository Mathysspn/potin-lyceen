<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Potin Lycéen</title>

    <link rel="stylesheet" href="./connexion.css">
</head>

<body>

    <main class="page-connexion">

        <div class="contenu">

            <!-- Bouton retour -->
            <a href="accueil.html" class="bouton-retour">←</a>

            <!-- Connexion -->
            <section class="connexion-box">

                <h1>Connexion</h1>

                <p class="sous-titre">
                    Connecte-toi à ton compte Potin Lycéen
                </p>

                <form id="formulaire-connexion">

                    <label for="pseudo">Nom d'utilisateur</label>
                    <input
                        type="text"
                        id="pseudo"
                        placeholder="Ton pseudo"
                        required
                    >

                    <label for="motdepasse">Mot de passe</label>
                    <input
                        type="password"
                        id="motdepasse"
                        placeholder="Ton mot de passe"
                        required
                    >

                    <button type="submit" class="bouton-principal">
                        Se connecter
                    </button>

                </form>

                <p class="inscription">
                    Pas encore de compte ?
                    <a href="inscription.html">Créer un compte</a>
                </p>

            </section>

        </div>

    </main>

    <script src="./connexion.js"></script>

</body>
</html>
